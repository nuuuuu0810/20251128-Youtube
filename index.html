<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube カスタムループ再生</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            grid-column: span 2;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #cc0000;
        }
        .status {
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>YouTube 区間リピート再生</h2>
    
    <div class="video-wrapper">
        <div id="player"></div>
    </div>

    <div class="controls">
        <div class="input-group" style="grid-column: span 2;">
            <label>動画ID (URLの v= の後ろ)</label>
            <!-- デフォルト値として猫の動画を入れています -->
            <input type="text" id="videoId" value="jfKfPfyJRdk" placeholder="例: jfKfPfyJRdk">
        </div>
        <div class="input-group">
            <label>開始時間 (秒)</label>
            <input type="number" id="startSec" value="0" min="0">
        </div>
        <div class="input-group">
            <label>終了時間 (秒)</label>
            <input type="number" id="endSec" value="10" min="1">
        </div>
        <button onclick="loadAndPlay()">設定して再生 / リロード</button>
    </div>
    
    <div class="status" id="statusText">ステータス: 準備完了</div>
</div>

<script>
    // YouTube IFrame Player APIを非同期でロード
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var loopInterval;

    // APIの準備ができたらプレイヤーを作成
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '360',
            width: '640',
            videoId: document.getElementById('videoId').value,
            playerVars: {
                'playsinline': 1,
                'rel': 0 // 関連動画を表示しない
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        document.getElementById('statusText').innerText = "ステータス: プレイヤー準備完了";
    }

    // 再生状態が変わった時の処理
    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            startLoopCheck();
            document.getElementById('statusText').innerText = "ステータス: 再生中 (ループ監視中)";
        } else {
            stopLoopCheck();
            if(event.data == YT.PlayerState.PAUSED) {
                document.getElementById('statusText').innerText = "ステータス: 一時停止";
            }
        }
    }

    // ボタンクリック時の処理
    function loadAndPlay() {
        var vId = document.getElementById('videoId').value;
        var start = parseFloat(document.getElementById('startSec').value);
        
        // IDがURL形式で入力された場合の対応 (簡易的)
        if(vId.includes('v=')) {
            vId = vId.split('v=')[1].split('&')[0];
        } else if (vId.includes('youtu.be/')) {
            vId = vId.split('youtu.be/')[1].split('?')[0];
        }

        if (player && player.loadVideoById) {
            player.loadVideoById({
                videoId: vId,
                startSeconds: start
            });
        }
    }

    // ループ監視ロジック
    function startLoopCheck() {
        // 多重起動防止
        stopLoopCheck();
        
        loopInterval = setInterval(function() {
            if (!player || !player.getCurrentTime) return;

            var currentTime = player.getCurrentTime();
            var start = parseFloat(document.getElementById('startSec').value);
            var end = parseFloat(document.getElementById('endSec').value);

            // 終了時間を超えていたら開始時間に戻す
            if (end > start && currentTime >= end) {
                player.seekTo(start);
            }
        }, 100); // 0.1秒ごとにチェック
    }

    function stopLoopCheck() {
        if (loopInterval) {
            clearInterval(loopInterval);
            loopInterval = null;
        }
    }
</script>

</body>
</html>
