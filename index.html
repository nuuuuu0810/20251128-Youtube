<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 自動ループ＆時間取得</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 22px; margin-bottom: 20px; }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 8px;
        }
        .input-group { display: flex; flex-direction: column; }
        .input-group.full-width { grid-column: span 2; }
        
        label { font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #555; }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        /* 読み取り専用フィールドのスタイル */
        input:read-only { background-color: #e0e0e0; color: #777; }

        button {
            grid-column: span 2;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #cc0000; }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
            border-radius: 8px;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .status { margin-top: 10px; text-align: right; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube 自動時間取得＆ループ再生</h1>

        <div class="input-area">
            <div class="input-group full-width">
                <label>YouTube URL</label>
                <input type="text" id="videoUrl" value="https://www.youtube.com/watch?v=jfKfPfyJRdk" placeholder="URLを貼り付け">
            </div>

            <div class="input-group">
                <label>開始時間 (秒)</label>
                <input type="number" id="startSec" value="0" min="0">
            </div>

            <div class="input-group">
                <label>終了時間 (秒) <small>※自動取得されます</small></label>
                <input type="number" id="endSec" placeholder="読込後に自動入力" step="0.1">
            </div>

            <button onclick="loadVideo()">動画を読み込んで再生</button>
        </div>

        <div class="video-container">
            <div id="player"></div>
        </div>
        <div class="status" id="statusMsg">準備完了</div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var timerInterval;
        var shouldUpdateDuration = false; // 新しい動画ロード時に時間を取得するかどうかのフラグ

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '360',
                width: '640',
                videoId: 'jfKfPfyJRdk', // 初期動画
                playerVars: { 'playsinline': 1 },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onReady': function(e) {
                        // 初期ロード時にも時間を取得
                        shouldUpdateDuration = true;
                    }
                }
            });
        }

        function onPlayerStateChange(event) {
            var statusMsg = document.getElementById('statusMsg');

            if (event.data == YT.PlayerState.PLAYING) {
                // 再生開始時にフラグが立っていれば総時間を取得して入力欄に入れる
                if (shouldUpdateDuration) {
                    var duration = player.getDuration();
                    if (duration) {
                        document.getElementById('endSec').value = Math.floor(duration);
                        shouldUpdateDuration = false; // 一度セットしたらフラグを下ろす（手動変更を邪魔しないため）
                    }
                }

                startLoopMonitor();
                statusMsg.innerText = "状態: 再生中";
            } 
            else if (event.data == YT.PlayerState.ENDED) {
                // 動画が自然に終了した場合、強制的に開始時間に戻す
                var start = parseFloat(document.getElementById('startSec').value) || 0;
                player.seekTo(start);
                player.playVideo();
            }
            else {
                stopLoopMonitor();
                statusMsg.innerText = "状態: 停止中";
            }
        }

        function loadVideo() {
            var urlInput = document.getElementById('videoUrl').value;
            var startInput = parseFloat(document.getElementById('startSec').value) || 0;
            var videoId = extractVideoID(urlInput);

            if (player && videoId) {
                // 新しい動画を読み込むときは「時間更新フラグ」を立てる
                shouldUpdateDuration = true;
                
                // 終了時間欄を一旦クリア（視覚的にわかりやすくするため）
                document.getElementById('endSec').value = "";

                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: startInput
                });
            }
        }

        // ループ監視（0.1秒ごとにチェック）
        function startLoopMonitor() {
            stopLoopMonitor();
            timerInterval = setInterval(function() {
                if (!player || !player.getCurrentTime) return;

                var currentTime = player.getCurrentTime();
                var start = parseFloat(document.getElementById('startSec').value) || 0;
                var endInput = document.getElementById('endSec').value;
                
                // 終了時間が未入力の場合は監視しない（動画の最後まで行く）
                if (endInput === "") return;

                var end = parseFloat(endInput);

                // 終了時間を超えたら開始時間に戻す
                // (currentTimeは微妙にズレるので、0.5秒程度のバッファを持たせても良いが今回は厳密に判定)
                if (end > start && currentTime >= end) {
                    player.seekTo(start);
                }
            }, 100);
        }

        function stopLoopMonitor() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function extractVideoID(url) {
            var videoId = "";
            if (url.indexOf("v=") !== -1) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.indexOf("youtu.be/") !== -1) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else {
                videoId = url;
            }
            return videoId;
        }
    </script>
</body>
</html>
